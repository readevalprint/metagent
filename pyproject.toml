[project]
name = "metagent"
version = "0.1.0"
description = "Class-based self-evolving LLM agent harness. Subclass Evolve; missing methods become deterministic code."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27", "pydantic>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
metagent = "metagent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["metagent*"]
